name: Website Job Monitor

on:
  schedule:
    - cron: '0 0 * * *' # Run once every day at midnight UTC
  workflow_dispatch: # Allows manual triggering

env:
  URL_TO_MONITOR: https://www.stirling-rawdon.com/business-development/careers/

jobs:
  monitor_website:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests beautifulsoup4

    - name: Get last recorded hash (if exists)
      id: get_last_hash
      run: |
        LAST_HASH=""
        if [ -f "last_hash.txt" ]; then
          LAST_HASH=$(cat last_hash.txt)
        fi
        echo "Last recorded hash: $LAST_HASH"
        echo "::set-output name=last_hash::$LAST_HASH"

    - name: Run website check script
      id: check_script
      run: python check_website.py

    - name: Log run details
      run: |
        TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        RUN_TYPE=${{ github.event_name }}
        CURRENT_HASH="${{ steps.check_script.outputs.current_hash }}"
        LAST_HASH="${{ steps.get_last_hash.outputs.last_hash }}"
        LOG_MESSAGE=""

        if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
          LOG_MESSAGE="[${TIMESTAMP}] (${RUN_TYPE}) - Detected CHANGE on ${URL_TO_MONITOR}. New hash: ${CURRENT_HASH}"
        else
          LOG_MESSAGE="[${TIMESTAMP}] (${RUN_TYPE}) - No change detected on ${URL_TO_MONITOR}. Hash: ${CURRENT_HASH}"
        fi

        echo "$LOG_MESSAGE" >> monitor.log
        echo "Appended to monitor.log: $LOG_MESSAGE"
      env:
        URL_TO_MONITOR: ${{ env.URL_TO_MONITOR }} # Ensure URL is available here for logging

    - name: Update last recorded hash
      # This step will still only run if a change was detected to update last_hash.txt
      if: steps.check_script.outputs.current_hash != steps.get_last_hash.outputs.last_hash
      run: echo "${{ steps.check_script.outputs.current_hash }}" > last_hash.txt

    - name: Commit log and hash changes
      # This action will commit both last_hash.txt (if changed) and monitor.log
      uses: EndBug/add-and-commit@v9
      with:
        message: 'Automated: Update monitor log and last known website content hash'
        add: 'monitor.log last_hash.txt' # Add both files
        default_author: github_actions
        # This ensures a commit happens even if only monitor.log changed
        # (e.g., if no content change, but we still log the run)
        # The 'add' command will only stage files that have actually changed.
        # If 'last_hash.txt' didn't change, it won't be staged/committed.
