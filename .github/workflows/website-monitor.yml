name: Website Job Monitor

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  # No email-related recipient or sender emails needed here anymore!
  URL_TO_MONITOR: https://www.stirling-rawdon.com/business-development/careers/ # The URL to monitor
  ISSUE_TITLE: "Website Job Opportunities Updated!" # Title for the GitHub Issue

jobs:
  monitor_website:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests beautifulsoup4

    - name: Get last recorded hash (if exists)
      id: get_last_hash
      run: |
        LAST_HASH=""
        if [ -f "last_hash.txt" ]; then
          LAST_HASH=$(cat last_hash.txt)
        fi
        echo "Last recorded hash: $LAST_HASH"
        echo "::set-output name=last_hash::$LAST_HASH"

    - name: Run website check script
      id: check_script
      # No email secrets passed here anymore
      run: python check_website.py

    - name: Create or Update GitHub Issue
      # This step will ONLY run if the current hash is different from the last hash
      if: steps.check_script.outputs.current_hash != steps.get_last_hash.outputs.last_hash
      uses: peter-evans/create-or-update-comment@v2 # Action to create/update an issue comment
      # OR use 'peter-evans/create-or-update-issue@v4' to create a new issue each time

      with:
        # We'll create a new issue for each change for clarity.
        # If you prefer to update an existing issue or comment on one,
        # you'd use a different Peter Evans action or specific parameters.
        token: ${{ secrets.GITHUB_TOKEN }} # Built-in token with permissions for repo
        issue-title: ${{ env.ISSUE_TITLE }}
        body: |
          The job opportunities section on [${{ env.URL_TO_MONITOR }}](${{ env.URL_TO_MONITOR }}) has been updated!
          
          **Check the page for details.**
          
          _This notification was generated automatically by the Website Job Monitor Action._
        labels: |
          notification
          website-update
        assignees: ${{ github.actor }} # Assign the issue to the person who triggered the workflow (or just 'github.actor')
        # If you want to update an existing issue instead of creating a new one:
        # issue-number: 1 # Replace with the actual issue number you want to update
        # update-issue: true
        # comment-author: 'github-actions[bot]' # To make the bot comment
        # body: | # Body for the comment
        #   Another update detected for [${{ env.URL_TO_MONITOR }}](${{ env.URL_TO_MONITOR }}).

    - name: Update last recorded hash
      if: steps.check_script.outputs.current_hash != steps.get_last_hash.outputs.last_hash
      run: echo "${{ steps.check_script.outputs.current_hash }}" > last_hash.txt

    - name: Commit new hash if changed
      if: steps.check_script.outputs.current_hash != steps.get_last_hash.outputs.last_hash
      uses: EndBug/add-and-commit@v9
      with:
        message: 'Automated: Update last known website content hash'
        add: 'last_hash.txt'
        default_author: github_actions
